name = "school-pocket-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "school-pocket-db"
database_id = "e40b072d-144d-4bf0-b501-5ee3425ccd1a"

# R2 Storage
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "school-pocket-images"

# Environment Variables
[vars]
FIREBASE_PROJECT_ID = "saas-apps-c5dce"

# Staging environment
[env.staging]
name = "school-pocket-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "school-pocket-db-staging"
database_id = "<your-staging-database-id>"
